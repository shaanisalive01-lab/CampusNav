<!DOCTYPE html>
<html lang="en" data-theme-default="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CampusNav | Explore</title>
    <meta name="description" content="Food, study spots, facilities and useful places on and around campus.">

    <meta name="theme-color" content="#080b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CampusNav">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="campusnav.css?v=home10">
    <script src="theme.js"></script>
</head>

<body data-page="explore">
    <script src="shell.js?v=2"></script>

    <main class="cn-main">

        <h1 class="cn-title">Explore</h1>
        <p class="cn-sub">Places on campus and around it</p>

        <div class="cn-search" role="search">
            <label class="sr-only" for="exploreSearch">Search places</label>
            <input id="exploreSearch" type="search" placeholder="Search places" autocomplete="off">
        </div>

        <div class="cn-tabs" role="group" aria-label="Filter places by type">
            <button type="button" class="explore-filter" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="explore-filter" data-filter="food" aria-pressed="false">Food</button>
            <button type="button" class="explore-filter" data-filter="study" aria-pressed="false">Study</button>
            <button type="button" class="explore-filter" data-filter="facilities" aria-pressed="false">Facilities</button>
            <button type="button" class="explore-filter" data-filter="nearby" aria-pressed="false">Nearby</button>
        </div>

        <section class="cn-section" id="campusSection" aria-labelledby="campusHeading">
            <div class="cn-section-head">
                <h2 id="campusHeading">On campus</h2>
            </div>
            <ol class="list" id="campusList"></ol>
        </section>

        <section class="cn-section" id="nearbySection" aria-labelledby="nearbyHeading">
            <div class="cn-section-head">
                <h2 id="nearbyHeading">Outside campus</h2>
            </div>
            <ol class="list" id="nearbyList"></ol>
        </section>

        <div class="cn-empty" id="noResults" hidden>
            <strong>No places match</strong>
            Try another word, or switch the filter back to All.
        </div>

        <p class="cn-footnote">
            Nearby places open Google Maps in a new tab.
        </p>

    </main>

    <script src="utils.js"></script>
    <script src="icons.js"></script>
    <script>

        const PLACES = [
            { name: "Library", category: "study", icon: "book", about: "Quiet study space, books and academic resources.", location: "library" },
            { name: "Cafeteria", category: "food", icon: "cup", about: "Food, breaks and a place to hang out with friends.", location: "cafeteria" },
            { name: "Physics Lab", category: "facilities", icon: "flask", about: "Block A · Room 105", location: "a105" },
            { name: "Block A", category: "facilities", icon: "building", about: "Main academic building and classrooms.", location: "block-a" }
        ];

        const NEARBY = [
            { name: "Cafes", icon: "cup", about: "Find cafes and coffee spots near campus.", query: "cafes" },
            { name: "Restaurants", icon: "fork", about: "Find restaurants and places to eat nearby.", query: "restaurants" },
            { name: "Hotels", icon: "bed", about: "Find nearby hotels and accommodation.", query: "hotels" },
            { name: "Transport", icon: "bus", about: "Find nearby transport and travel options.", query: "transport" }
        ];

        const search = document.getElementById("exploreSearch");
        const filters = document.querySelectorAll(".explore-filter");

        let currentFilter = "all";


        function campusRow(place) {

            return (
                '<a class="list-row" href="map.html?destination=' + encodeURIComponent(place.location) + '">' +
                    '<span class="row-tile">' + iconSVG(place.icon) + "</span>" +
                    '<div class="row-body"><h3>' + escapeHTML(place.name) + "</h3><p>" + escapeHTML(place.about) + "</p></div>" +
                    '<span class="row-arrow">' + iconSVG("arrow") + '<span class="sr-only">Navigate</span></span>' +
                "</a>"
            );
        }


        function nearbyRow(place) {

            const url = "https://www.google.com/maps/search/" +
                encodeURIComponent(place.query + " near SMVIT Bangalore");

            return (
                '<a class="list-row" href="' + escapeHTML(url) + '" target="_blank" rel="noopener noreferrer">' +
                    '<span class="row-tile">' + iconSVG(place.icon) + "</span>" +
                    '<div class="row-body"><h3>' + escapeHTML(place.name) + "</h3><p>" + escapeHTML(place.about) + "</p></div>" +
                    '<span class="row-arrow">' + iconSVG("external") + '<span class="sr-only">Opens Google Maps in a new tab</span></span>' +
                "</a>"
            );
        }


        function render() {

            const query = search.value.trim().toLowerCase();

            const matches = function (item) {
                return !query || (item.name + " " + item.about).toLowerCase().includes(query);
            };

            const campus = PLACES.filter(function (place) {
                return (currentFilter === "all" || place.category === currentFilter) && matches(place);
            });

            const nearby = NEARBY.filter(function (place) {
                return (currentFilter === "all" || currentFilter === "nearby") && matches(place);
            });

            document.getElementById("campusList").innerHTML = campus.map(campusRow).join("");

            document.getElementById("nearbyList").innerHTML = nearby.map(nearbyRow).join("");

            document.getElementById("campusSection").hidden = campus.length === 0;

            document.getElementById("nearbySection").hidden = nearby.length === 0;

            document.getElementById("noResults").hidden = campus.length + nearby.length > 0;
        }


        filters.forEach(function (filter) {

            filter.addEventListener("click", function () {

                filters.forEach(function (item) {
                    item.setAttribute("aria-pressed", String(item === filter));
                });

                currentFilter = filter.dataset.filter;

                render();
            });
        });

        search.addEventListener("input", render);

        render();

    </script>
</body>

</html>
