<!DOCTYPE html>
<html lang="en" data-theme-default="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CampusNav | Club admin</title>
    <meta name="description" content="Create and manage events for your club.">

    <meta name="theme-color" content="#080b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CampusNav">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="campusnav.css?v=home10">
    <script src="theme.js"></script>
</head>

<body data-page="clubs">
    <script src="shell.js?v=2"></script>

    <main class="cn-main narrow">

        <h1 class="cn-title">Club admin</h1>
        <p class="cn-sub">Robotics Club · club leader</p>

        <p class="demo-banner" role="note">
            <strong>Local demo:</strong>
            changes made here are saved only in this browser.
            Other students will not see them, and this page has no login.
        </p>

        <p class="cn-lede">
            Manage your club and publish events for students across campus.
        </p>

        <div class="notification" id="notification" role="status">
            <div class="notification-title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg>Campus update</div>
            <p id="notificationText"></p>
        </div>

        <section class="cn-section" aria-labelledby="createHeading">
            <div class="cn-section-head">
                <h2 id="createHeading">Create event</h2>
            </div>

            <div class="panel form-card">
                <div class="field">
                    <label for="eventName">Event name</label>
                    <input type="text" id="eventName" placeholder="e.g. Robotics Workshop" autocomplete="off">
                </div>

                <div class="field-pair">
                    <div class="field">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate">
                    </div>

                    <div class="field">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime">
                    </div>
                </div>

                <div class="field">
                    <label for="eventLocation">Location</label>
                    <select id="eventLocation">
                        <option value="block-a">Block A</option>
                        <option value="a201">Block A · Room 201</option>
                        <option value="a204">Block A · Room 204</option>
                        <option value="a105">Block A · Room 105</option>
                        <option value="library">Library</option>
                        <option value="cafeteria">Cafeteria</option>
                    </select>
                </div>

                <div class="field">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Tell students what the event is about..."></textarea>
                </div>

                <button type="button" class="cn-btn" id="publishEventBtn">Publish event</button>
            </div>
        </section>

        <section class="cn-section" aria-labelledby="yoursHeading">
            <div class="cn-section-head">
                <h2 id="yoursHeading">Your events</h2>
            </div>

            <div class="event-list" id="eventList"></div>
        </section>

    </main>

    <script src="utils.js"></script>
    <script src="icons.js"></script>
    <script>

        /* =========================
           STORAGE
        ========================= */

        function loadEvents() {

            return loadClubEvents();

        }


        function saveEvents(events) {

            writeJSON(
                CLUB_EVENTS_KEY,
                events
            );

        }



        /* =========================
           CREATE EVENT
        ========================= */

        function createEvent() {

            const name =
                document
                    .getElementById("eventName")
                    .value
                    .trim();


            const date =
                document
                    .getElementById("eventDate")
                    .value;


            const time =
                document
                    .getElementById("eventTime")
                    .value;


            const locationId =
                document
                    .getElementById("eventLocation")
                    .value;


            const description =
                document
                    .getElementById("eventDescription")
                    .value
                    .trim();


            /* VALIDATION */

            if (name === "") {

                alert(
                    "Please enter an event name."
                );

                return;

            }


            if (date === "") {

                alert(
                    "Please select a date."
                );

                return;

            }


            if (time === "") {

                alert(
                    "Please select a time."
                );

                return;

            }


            /* CREATE OBJECT */

            const newEvent = {

                id: Date.now(),

                name: name,

                date: date,

                time: time,

                location: locationId,

                description: description,

                club: "Robotics Club"

            };


            /* LOAD EXISTING */

            const events =
                loadEvents();


            /* ADD NEW EVENT */

            events.push(newEvent);


            /* SAVE */

            saveEvents(events);


            /* RESET FORM */

            document
                .getElementById("eventName")
                .value = "";


            document
                .getElementById("eventDate")
                .value = "";


            document
                .getElementById("eventTime")
                .value = "";


            document
                .getElementById("eventDescription")
                .value = "";


            /* REFRESH EVENTS */

            displayEvents();


            /* NOTIFICATION */

            showNotification(
                name +
                " has been published for students."
            );

        }



        /* =========================
           DISPLAY EVENTS
        ========================= */

        function displayEvents() {

            const container =
                document.getElementById(
                    "eventList"
                );


            const events =
                loadEvents();


            container.innerHTML = "";


            if (events.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        No events created yet.

                        <br><br>

                        Create your first club event above.

                    </div>

                `;

                return;

            }


            events.forEach(
                function(event) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "event-card";


                    const locationName =
                        getLocationName(
                            event.location
                        );


                    card.innerHTML = `

                        <h3>
                            ${escapeHTML(
                                event.name
                            )}
                        </h3>


                        <span class="row-meta">Robotics Club</span>


                        <p>
                            ${iconSVG("calendar")}
                            ${formatDate(
                                event.date
                            )}
                        </p>


                        <p>
                            ${iconSVG("clock")}
                            ${formatTime(
                                event.time
                            )}
                        </p>


                        <p>
                            ${iconSVG("pin")}
                            ${escapeHTML(locationName)}
                        </p>


                        ${
                            event.description
                                ? `
                                    <p class="event-description">
                                        ${escapeHTML(
                                            event.description
                                        )}
                                    </p>
                                  `
                                : ""
                        }


                        <div class="event-actions">

                            <a
                                class="small-btn"
                                href="map.html?destination=${encodeURIComponent(
                                    event.location
                                )}"
                            >
                                Navigate
                            </a>


                            <button
                                type="button"
                                class="small-btn delete-btn"
                                data-event-id="${escapeHTML(event.id)}"
                            >
                                Delete
                            </button>

                        </div>

                    `;


                    const deleteButton =
                        card.querySelector(
                            ".delete-btn"
                        );


                    deleteButton.addEventListener(
                        "click",
                        function() {

                            deleteEvent(
                                event.id
                            );

                        }
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }



        /* =========================
           DELETE EVENT
        ========================= */

        function deleteEvent(
            eventId
        ) {

            const confirmed =
                window.confirm(
                    "Delete this event?"
                );


            if (!confirmed) {
                return;
            }


            const events =
                loadEvents();


            const updatedEvents =
                events.filter(
                    function(event) {

                        return event.id !==
                            eventId;

                    }
                );


            saveEvents(
                updatedEvents
            );


            displayEvents();


            showNotification(
                "Event deleted successfully."
            );

        }



        /* =========================
           LOCATION
        ========================= */

        function getLocationName(
            locationId
        ) {

            const locations = {

                "block-a":
                    "Block A",

                "a201":
                    "Block A · Room 201",

                "a204":
                    "Block A · Room 204",

                "a105":
                    "Block A · Room 105",

                "library":
                    "Library",

                "cafeteria":
                    "Cafeteria"

            };


            return (
                locations[locationId] ||
                "Campus"
            );

        }



        /* =========================
           DATE
        ========================= */

        function formatDate(
            dateString
        ) {

            const date =
                new Date(
                    dateString +
                    "T00:00:00"
                );


            return date.toLocaleDateString(
                undefined,
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short"
                }
            );

        }



        /* =========================
           TIME
        ========================= */

        function formatTime(
            timeString
        ) {

            const parts =
                timeString.split(":");


            let hours =
                Number(parts[0]);


            const minutes =
                parts[1];


            const suffix =
                hours >= 12
                    ? "PM"
                    : "AM";


            hours =
                hours % 12 || 12;


            return (
                hours +
                ":" +
                minutes +
                " " +
                suffix
            );

        }



        /* =========================
           NOTIFICATION
        ========================= */

        function showNotification(
            message
        ) {

            const box =
                document.getElementById(
                    "notification"
                );


            const text =
                document.getElementById(
                    "notificationText"
                );


            text.textContent =
                message;


            box.classList.add(
                "active"
            );


            setTimeout(
                function() {

                    box.classList.remove(
                        "active"
                    );

                },
                4000
            );

        }



        /* escapeHTML() now lives in utils.js */






        /* =========================
           INITIALIZE
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                displayEvents();


                document
                    .getElementById(
                        "publishEventBtn"
                    )
                    .addEventListener(
                        "click",
                        createEvent
                    );

            }
        );

    </script>
</body>

</html>
