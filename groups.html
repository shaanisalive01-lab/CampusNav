<!DOCTYPE html>
<html lang="en" data-theme-default="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CampusNav | Groups</title>
    <meta name="description" content="Clubs, study groups and communities on campus. Join one and find where it meets.">

    <meta name="theme-color" content="#080b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CampusNav">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="campusnav.css?v=home10">
    <script src="theme.js"></script>
</head>

<body data-page="groups">
    <script src="shell.js?v=2"></script>

    <main class="cn-main">

        <h1 class="cn-title">Groups</h1>
        <p class="cn-sub">Clubs, study groups and communities</p>

        <div class="cn-search" role="search">
            <label class="sr-only" for="groupSearch">Search groups</label>
            <input id="groupSearch" type="search" placeholder="Search groups" autocomplete="off">
        </div>

        <div class="cn-tabs fit" role="group" aria-label="Filter groups by type">
            <button type="button" class="group-filter" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="group-filter" data-filter="academic" aria-pressed="false">Academic</button>
            <button type="button" class="group-filter" data-filter="technical" aria-pressed="false">Technical</button>
            <button type="button" class="group-filter" data-filter="social" aria-pressed="false">Social</button>
        </div>

        <section class="cn-section" id="mineSection" aria-labelledby="mineHeading">
            <div class="cn-section-head">
                <h2 id="mineHeading">Your groups</h2>
            </div>
            <ol class="list" id="mineList"></ol>
        </section>

        <section class="cn-section" id="discoverSection" aria-labelledby="discoverHeading">
            <div class="cn-section-head">
                <h2 id="discoverHeading">Find a group</h2>
            </div>
            <ol class="list" id="discoverList"></ol>
        </section>

        <div class="cn-empty" id="noGroups" hidden>
            <strong>No groups match</strong>
            Try another word, or switch the filter back to All.
        </div>

        <p class="cn-footnote">
            Joining is saved on this device only. Member counts are samples until clubs are connected to a shared
            backend.
            Club leader? <a href="club-admin.html">Open club admin</a>.
        </p>

    </main>

    <script src="utils.js"></script>
    <script src="icons.js"></script>
    <script>

        const GROUPS = [
            { id: "robotics", name: "Robotics Club", category: "technical", icon: "cpu", about: "Build, experiment and work on robotics projects together.", members: 42, place: "Block A", location: "block-a", joined: true },
            { id: "maths", name: "Engineering Maths Study Group", category: "academic", icon: "book", about: "Work through problems, revise and survive mathematics together.", members: 18, place: "Library", location: "library", joined: true },
            { id: "cad", name: "CAD & Design", category: "technical", icon: "building", about: "Design, CAD modelling and engineering projects.", members: 27, place: "Room 204", location: "a204" },
            { id: "f1", name: "F1 & Motorsport", category: "social", icon: "car", about: "Motorsport discussions, racing and car culture.", members: 31, place: "Library", location: "library" },
            { id: "sih", name: "SIH & Innovation", category: "technical", icon: "bulb", about: "Hackathons, prototypes and student innovation projects.", members: 24, place: "Block A", location: "block-a" },
            { id: "gaming", name: "Campus Gaming", category: "social", icon: "game", about: "Games, tournaments and casual gaming sessions.", members: 36, place: "Cafeteria", location: "cafeteria" },
            { id: "media", name: "Photography & Media", category: "social", icon: "camera", about: "Photography, video, editing and campus content.", members: 21, place: "Main Gate", location: "main-gate" },
            { id: "startup", name: "Entrepreneurship Hub", category: "academic", icon: "flag", about: "Ideas, startups, business and student-led projects.", members: 19, place: "Block A", location: "block-a" }
        ];

        const JOINED_KEY = "campusnav-joined-groups";

        const KNOWN_IDS = GROUPS.map(function (group) { return group.id; });


        // Which groups the student joined: from this device, else the defaults.
        let joined = readJSON(
            JOINED_KEY,
            GROUPS.filter(function (group) { return group.joined; }).map(function (group) { return group.id; }),
            function (value) {
                return Array.isArray(value) && value.every(function (id) { return KNOWN_IDS.includes(id); });
            }
        );

        let currentFilter = "all";

        const search = document.getElementById("groupSearch");
        const mineList = document.getElementById("mineList");
        const discoverList = document.getElementById("discoverList");
        const filters = document.querySelectorAll(".group-filter");


        function rowHTML(group) {

            const isJoined = joined.includes(group.id);

            return (
                '<li class="list-row">' +
                    '<span class="row-tile">' + iconSVG(group.icon) + "</span>" +
                    '<div class="row-body"><h3>' + escapeHTML(group.name) + "</h3>" +
                        "<p>" + escapeHTML(group.about) + "</p>" +
                        '<span class="row-meta">' + group.members + " members · " + escapeHTML(group.place) + "</span></div>" +
                    '<div class="row-actions">' +
                        '<button type="button" class="cn-btn sm' + (isJoined ? "" : "") + '" data-join="' + escapeHTML(group.id) +
                            '" aria-pressed="' + isJoined + '">' + (isJoined ? "Joined" : "Join") + "</button>" +
                        '<a class="cn-btn sm quiet" href="map.html?destination=' + encodeURIComponent(group.location) +
                            '" aria-label="Navigate to ' + escapeHTML(group.place) + '">Navigate</a>' +
                    "</div>" +
                "</li>"
            );
        }


        function render() {

            const query = search.value.trim().toLowerCase();

            const visible = GROUPS.filter(function (group) {

                const filterMatch = currentFilter === "all" || group.category === currentFilter;

                const searchMatch = !query ||
                    (group.name + " " + group.about + " " + group.place).toLowerCase().includes(query);

                return filterMatch && searchMatch;
            });

            const mine = visible.filter(function (group) { return joined.includes(group.id); });

            const others = visible.filter(function (group) { return !joined.includes(group.id); });

            mineList.innerHTML = mine.map(rowHTML).join("");

            discoverList.innerHTML = others.map(rowHTML).join("");

            document.getElementById("mineSection").hidden = mine.length === 0;

            document.getElementById("discoverSection").hidden = others.length === 0;

            document.getElementById("noGroups").hidden = visible.length > 0;
        }


        // Join / leave
        document.addEventListener("click", function (event) {

            const button = event.target.closest("[data-join]");

            if (!button) {
                return;
            }

            const id = button.dataset.join;

            joined = joined.includes(id)
                ? joined.filter(function (item) { return item !== id; })
                : joined.concat(id);

            writeJSON(JOINED_KEY, joined);

            render();
        });


        filters.forEach(function (filter) {

            filter.addEventListener("click", function () {

                filters.forEach(function (item) {
                    item.setAttribute("aria-pressed", String(item === filter));
                });

                currentFilter = filter.dataset.filter;

                render();
            });
        });


        search.addEventListener("input", render);

        render();

    </script>
</body>

</html>
