<!doctype html>
<html lang="en" data-theme="light" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CampusNav</title>
  <meta name="description" content="Campus navigation, timetable, events and clubs.">
  <script>
    /* apply saved theme before paint to avoid a flash */
    try {
      var p = JSON.parse(localStorage.getItem("campusnav-v2-prefs") || "{}");
      var mode = p.theme || "system";
      var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (p.accent) document.documentElement.dataset.accent = p.accent;
      if (p.motion === "off") document.documentElement.dataset.motion = "off";
    } catch (e) {}

    /* embed mode: the main CampusNav site shows this map inside its own
       header and tab bar, so v2's own chrome is hidden and the theme comes
       from the parent page (?embed=1&theme=dark|light, then postMessage). */
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("embed")) {
        document.documentElement.dataset.embed = "1";
        var t0 = q.get("theme");
        if (t0 === "dark" || t0 === "light") document.documentElement.dataset.theme = t0;
      }
      window.addEventListener("message", function (e) {
        if (e.origin === location.origin && e.data && (e.data.theme === "dark" || e.data.theme === "light")) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=embed1">
</head>

    </defs>
  </svg>

  <div class="app">
    <aside class="rail" aria-label="Primary">
      <a class="brand" href="#/home" aria-label="CampusNav home"><svg class="i"><use href="#i-compass"/></svg></a>
      <div id="railNav" style="display:contents"></div>
      <div class="spacer"></div>
      <button class="nav-btn" id="openSettings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg>Settings</button>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="viewTitle">Home</h1>
        <button class="search-trigger" id="openPalette" aria-label="Search campus (Ctrl K)">
          <svg class="i"><use href="#i-search"/></svg><span>Search places, classes, events…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="clock-chip mono" id="clockChip" aria-live="off"></div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><svg class="i"><use href="#i-moon"/></svg></button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Primary mobile"></nav>

  <dialog id="palette" aria-label="Search">
    <div class="pal-input"><svg class="i"><use href="#i-search"/></svg><input id="palInput" type="text" placeholder="Search or run a command…" autocomplete="off" spellcheck="false" role="combobox" aria-controls="palList" aria-expanded="true"></div>
    <ul class="pal-list" id="palList" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </dialog>

  <dialog id="settings" aria-label="Settings"><div class="settings" id="settingsBody"></div></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="../utils.js"></script>
  <script src="../campusData.js"></script>
  <script src="../timetableData.js"></script>
  <script src="app.js"></script>
</body>
</html>
