<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CampusNav</title>
    <meta name="description" content="Your next class, the way to it, your timetable and what is on at campus.">
    <meta name="theme-color" content="#ffffff">
    <script>
        /* Apply the theme before the first paint. No saved choice means "follow the phone".
           The storage key is the one the main app uses, so a choice carries across. */
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("campusnav-theme"); } catch (e) {}
            if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CampusNav">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <!-- To do before release: self-host this font and the photo reader in app/scan.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="app/app.css?v=11">
</head>
<body>
    <noscript><p style="padding:24px">CampusNav needs JavaScript to show the map and your classes.</p></noscript>
    <div class="app" id="app">

        <!-- the map is always the ground of the app -->
        <div class="stage">
            <svg id="map" role="img" aria-label="Campus map"></svg>

            <header class="top">
                <a class="logo" href="#home" title="Home">Campus<span>Nav</span></a>
                <form class="search" id="search" role="search">
                    <svg aria-hidden="true"><use href="#i-search" /></svg>
                    <input id="q" type="search" placeholder="Where to?" aria-label="Find a room or place"
                        autocomplete="off" enterkeyhint="go">
                </form>
                <ul class="results" id="results" aria-label="Matching places" hidden></ul>
            </header>
        </div>

        <div class="banner" id="banner" aria-live="polite" hidden></div>

        <main class="sheet" id="sheet"></main>

        <button type="button" class="recenter" id="recenter" aria-label="Recentre the map" title="Recentre the map" hidden>
            <svg aria-hidden="true"><use href="#i-target" /></svg>
        </button>

        <div class="toast" id="toast" role="status" hidden></div>

        <div class="theme">
            <button type="button" class="theme-btn" id="themeBtn" title="Theme" aria-expanded="false" aria-controls="themeMenu">
                <svg aria-hidden="true"><use id="themeIcon" href="#i-auto" /></svg>
            </button>
            <div class="theme-menu" id="themeMenu" role="group" aria-label="Theme" hidden>
                <button type="button" data-theme-choice="system"><svg aria-hidden="true"><use href="#i-auto" /></svg>System</button>
                <button type="button" data-theme-choice="light"><svg aria-hidden="true"><use href="#i-sun" /></svg>Light</button>
                <button type="button" data-theme-choice="dark"><svg aria-hidden="true"><use href="#i-moon" /></svg>Dark</button>
            </div>
        </div>

        <nav class="tabs" aria-label="Main">
            <a href="#home" data-tab="home"><svg aria-hidden="true"><use href="#i-home" /></svg><span>Home</span></a>
            <a href="#map" data-tab="map"><svg aria-hidden="true"><use href="#i-map" /></svg><span>Map</span></a>
            <a href="#day" data-tab="day"><svg aria-hidden="true"><use href="#i-day" /></svg><span>My day</span></a>
            <a href="#profs" data-tab="profs"><svg aria-hidden="true"><use href="#i-people" /></svg><span>Profs</span></a>
            <a href="#events" data-tab="events"><svg aria-hidden="true"><use href="#i-star" /></svg><span>Events</span></a>
        </nav>
    </div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" /></symbol>
        <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="1.500" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.500v.500" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4" /></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 21 20H3zM12 10v4M12 17v.500" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></symbol>
        <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14" /></symbol>
        <symbol id="i-day" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.700 5.600 6.100.900-4.400 4.300 1 6.100-5.400-2.900-5.400 2.900 1-6.100-4.400-4.300 6.100-.900z" /></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.500-5-2-8-1.500v14c3-.500 6 0 8 1.500 2-1.500 5-2 8-1.500v-14c-3-.500-6 0-8 1.500zM12 6v14" /></symbol>
        <symbol id="i-cup" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.500a2.500 2.500 0 0 1 0 5H17M8 3v3M12.500 3v3" /></symbol>
        <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.800 3h10.400a2 2 0 0 0 1.800-3l-5-9V3M7.500 15h9" /></symbol>
        <symbol id="i-building" viewBox="0 0 24 24"><path d="M5 21V5l7-2 7 2v16M3 21h18M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4" /></symbol>
        <symbol id="i-gate" viewBox="0 0 24 24"><path d="M4 21V8l8-4 8 4v13M9 21v-9M15 21v-9M12 21v-9M4 12h16" /></symbol>
        <symbol id="i-door" viewBox="0 0 24 24"><path d="M5 21V4h14v17M3 21h18M14.500 12.500h.010" /></symbol>
        <symbol id="i-stairs" viewBox="0 0 24 24"><path d="M3 20h5v-5h5v-5h5V5h3" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4M5 11l7-7 7 7" /></symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 20v-7a4 4 0 0 0-4-4H5M10 4 5 9l5 5" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 20v-7a4 4 0 0 1 4-4h10M14 4l5 5-5 5" /></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h13l-3 4.500 3 4.500H5" /></symbol>
        <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.500" r="1.800" /><path d="m10 21 2.500-6-2-3 1-4.500L8 9.500 7 13M11.500 7.500 15 10l3 1M12.500 15l3 2.500.500 3.500" /></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.500-5.600-6.500-11a6.500 6.500 0 0 1 13 0c0 5.400-6.500 11-6.500 11z" /><circle cx="12" cy="10" r="2.400" /></symbol>
        <symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21v-7M17 14c-2 0-3-1-3-4 0-4 1.500-7 3-7z" /></symbol>
        <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6M7 12h.010" /></symbol>
        <symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="3" /><path d="M5 11h14M8 18v3M16 18v3M8.500 14.500h.010M15.500 14.500h.010" /></symbol>
        <symbol id="i-out" viewBox="0 0 24 24"><path d="M8 16 17 7M9 7h8v8" /></symbol>
        <symbol id="i-auto" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.500 1.500M17.500 17.500 19 19M5 19l1.500-1.500M17.500 6.500 19 5" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.500A8.500 8.500 0 0 1 9.500 4 8.500 8.500 0 1 0 20 14.500z" /></symbol>
        <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500" /><path d="M3 20c.500-3.800 3-5.500 6-5.500s5.500 1.700 6 5.500M16 5a3.200 3.200 0 0 1 0 6M17.500 14.800c2 .600 3.200 2.300 3.500 5.200" /></symbol>
        <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" /><circle cx="12" cy="13" r="3.500" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500" /></symbol>
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
    </svg>

    <script src="utils.js?v=2"></script>
    <script src="campusData.js?v=3"></script>
    <script src="timetableData.js?v=2"></script>
    <script src="eventsData.js?v=3"></script>
    <script src="app/routing.js?v=1"></script>
    <script src="app/parser.js?v=4"></script>
    <script src="app/scan.js?v=7"></script>
    <script src="app/professors.js?v=1"></script>
    <script src="app/profs.js?v=3"></script>
    <script src="app/map3d.js?v=5"></script>
    <script src="app/lists.js?v=1"></script>
    <script src="app/groups.js?v=1"></script>
    <script src="app/info.js?v=1"></script>
    <script src="app/admin.js?v=2"></script>
    <script src="app/theme.js?v=1"></script>
    <script src="app/app.js?v=13"></script>
</body>
</html>
